<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#111111"/>

  <!-- Rear wheel -->
  <circle cx="152" cy="330" r="78" fill="none" stroke="#FFE500" stroke-width="26"/>
  <circle cx="152" cy="330" r="18" fill="#FFE500"/>

  <!-- Front wheel -->
  <circle cx="370" cy="330" r="78" fill="none" stroke="#FFE500" stroke-width="26"/>
  <circle cx="370" cy="330" r="18" fill="#FFE500"/>

  <!-- Frame: seat rail to rear axle -->
  <line x1="152" y1="330" x2="220" y2="210" stroke="#FFE500" stroke-width="22" stroke-linecap="round"/>

  <!-- Frame: top tube -->
  <line x1="220" y1="210" x2="320" y2="200" stroke="#FFE500" stroke-width="22" stroke-linecap="round"/>

  <!-- Frame: down tube / engine area -->
  <line x1="220" y1="210" x2="295" y2="300" stroke="#FFE500" stroke-width="18" stroke-linecap="round"/>
  <line x1="295" y1="300" x2="370" y2="330" stroke="#FFE500" stroke-width="18" stroke-linecap="round"/>

  <!-- Front fork -->
  <line x1="320" y1="200" x2="370" y2="330" stroke="#FFE500" stroke-width="22" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="310" y1="195" x2="345" y2="175" stroke="#FFE500" stroke-width="16" stroke-linecap="round"/>

  <!-- Rider torso -->
  <line x1="240" y1="205" x2="290" y2="155" stroke="#FFE500" stroke-width="26" stroke-linecap="round"/>

  <!-- Rider head -->
  <circle cx="295" cy="138" r="30" fill="#FFE500"/>

  <!-- Sync arcs (signal / connectivity) — top right -->
  <path d="M 390 108 A 38 38 0 0 1 448 108" fill="none" stroke="#FF6B00" stroke-width="16" stroke-linecap="round"/>
  <path d="M 374 88  A 62 62 0 0 1 464 88"  fill="none" stroke="#FF6B00" stroke-width="14" stroke-linecap="round"/>
  <path d="M 358 68  A 86 86 0 0 1 480 68"  fill="none" stroke="#FF6B00" stroke-width="12" stroke-linecap="round"/>
  <!-- Dot at base of arcs -->
  <circle cx="419" cy="122" r="10" fill="#FF6B00"/>
</svg>
